; Compose hardware and profile. Each PIOENV gets its own build directory.
[env:nxtBike_os_S3_N16R8_dev]
extends = hardware_s3_n16r8, profile_dev
build_flags =
    ${hardware_s3_n16r8.build_flags}
    ${profile_dev.build_flags}

[env:nxtBike_os_S3_N16R8_prod]
extends = hardware_s3_n16r8, profile_prod
build_flags =
    ${hardware_s3_n16r8.build_flags}
    ${profile_prod.build_flags}
