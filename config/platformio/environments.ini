; Compose hardware and profile. Each PIOENV gets its own build and sdkconfig.
[env:nxtBike_os_S3_N16R8_dev]
extends = hardware_s3_n16r8, profile_dev
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="config/sdkconfig/common.defaults;${hardware_s3_n16r8.custom_sdkconfig};${profile_dev.custom_sdkconfig}"

[env:nxtBike_os_S3_N16R8_prod]
extends = hardware_s3_n16r8, profile_prod
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="config/sdkconfig/common.defaults;${hardware_s3_n16r8.custom_sdkconfig};${profile_prod.custom_sdkconfig}"
