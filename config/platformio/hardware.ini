; Hardware sections are templates, not directly buildable environments.
[hardware_s3_n16r8]
board = esp32-s3-devkitc-1
; Override the base N8 board for WROOM-1-N16R8.
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = config/partitions/esp32s3-n16r8.csv
custom_sdkconfig = config/sdkconfig/esp32s3-n16r8.defaults
