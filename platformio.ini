[platformio]
description = nxtBike.os [S3 N16R8]
default_envs = nxtBike_os_S3_N16R8
src_dir = main

[env:nxtBike_os_S3_N16R8]
; https://registry.platformio.org/platforms/platformio/espressif32
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = pre:scripts/build_version.py

; Override the base N8 board for WROOM-1-N16R8.
; Octal PSRAM is configured through sdkconfig.defaults for ESP-IDF.
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

monitor_speed = 115200
