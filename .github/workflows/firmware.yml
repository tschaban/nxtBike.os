name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: nxtBike_os_S3_N16R8_dev
            profile: dev
          - environment: nxtBike_os_S3_N16R8_prod
            profile: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        # esptool 4.9 imports intelhex, which the pinned platform may omit.
        run: python -m pip install platformio==6.1.18 intelhex==2.3.0

      - name: Build firmware
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          export NXTB_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          pio run -e ${{ matrix.environment }}

      - name: Verify effective firmware profile
        run: python scripts/check_profile.py ${{ matrix.profile }} .pio/build/${{ matrix.environment }}

      - name: Test version allocation
        run: python -m unittest discover -s tests -v

      - name: Save firmware and debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.environment }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/firmware-version.json
          if-no-files-found: error
          retention-days: 14
